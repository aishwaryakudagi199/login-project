<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
</head>
<body>
    {% for message in messages %}
    <div class = "alert alert-{{ message.tag }} alert-dismissable fade show" role = "alert">
    <strong>Message:</strong>{{ message }}
    <button type = "button" class="close" data-dismiss = "alert" aria-label="close">
    <span aria-hidden="true">&times;</span>
    </button>
    </div>
    {% endfor %}

    <h1>Welcome User</h1>
    {% if user.is_authenticated %}
    <h1>Hello {{ fname }}</h1>
    <h4>You're successfully logged in</h4>
    <button type="submit"><a href="/signout">sign out</a></button>
    {% else %}
    <button type="submit"><a href="/signup">sign up</a></button>
    <button type="submit"><a href="/signin">sign in</a></button>
    {% endif %}
</body>
</html>
